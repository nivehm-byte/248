     ── TO REINSTATE ────────────────────────────────────────────────────────
     1. Drop the 17 photos into the project root. Filenames are FirstName.jpg
        exactly as referenced in the markup below, David being the exception
        at headshot.jpg.
     2. Paste BLOCK A into index.html's <style>, immediately before the
        "ABOUT HEADER" banner (that is where it came from).
     3. Paste BLOCK B into the two responsive queries - the repeat(2, 1fr)
        line goes in @media (max-width: 900px), the 1fr line in
        @media (max-width: 580px).
     4. Paste BLOCK C into #page-about, between the Testimonials section and
        the "An Invitation" CTA.
     5. Re-check the About colour rhythm. With this section gone, Testimonials
        and the CTA are both off-white and sit adjacent. This section was the
        sand band that separated them, so putting it back restores the
        alternation on its own.

     ── STILL OUTSTANDING WHEN THIS GOES BACK ───────────────────────────────
     The styling pass that was parked before launch:
       - the h2 is roughly 3x longer than any other on the site
       - the reveal stagger reaches 0.72s across 18 cards, so the bottom row
         visibly lags behind the top. Shorten the step or restart per row.
     ═══════════════════════════════════════════════════════════════════════ -->

<!--
    /* ════════════════════════════════════════
       MEMBERS GRID (4-col)
    ════════════════════════════════════════ */
    .members-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-top: 3rem;
      align-items: start;
    }

    .member-card {
      position: relative;
      overflow: hidden;
      height: 22rem;
      padding: 1.6rem 1.5rem;
      background: var(--charcoal);
      border: 1px solid rgba(var(--charcoal-rgb), 0.08);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s;
    }

    .member-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 44px rgba(var(--charcoal-rgb), 0.22), 0 4px 12px rgba(var(--charcoal-rgb), 0.12);
    }

    .member-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      z-index: 0;
      transition: transform 0.6s var(--ease-out);
    }

    .member-card:hover .member-photo { transform: scale(1.06); }

    .member-card::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to top, rgba(15, 13, 11, 0.92) 0%, rgba(15, 13, 11, 0.55) 38%, rgba(15, 13, 11, 0.08) 78%);
    }

    .member-info {
      position: relative;
      z-index: 2;
    }

    .member-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 0.2rem;
    }

    .member-role {
      display: block;
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      /* Reserve two lines so a wrapping role never lifts the name above it */
      line-height: 1.5;
      min-height: 3em;
      margin-bottom: 0.7rem;
    }

    .member-card p {
      font-size: 0.845rem;
      font-weight: 400;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.82);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(10px);
      transition: max-height 0.5s var(--ease-out), opacity 0.4s ease, transform 0.5s var(--ease-out);
    }

    .member-card:hover p {
      max-height: 200px;
      opacity: 1;
      transform: translateY(0);
    }
-->
